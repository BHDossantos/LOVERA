[project]
name = "matchmaker-api"
version = "0.1.0"
description = "AI Matchmaker pilot API: verified, no-swipe dating concierge"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pydantic-settings",
  "email-validator",
  "pyjwt",
  "httpx",
  "anthropic",
  "python-multipart",
  "websockets",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
