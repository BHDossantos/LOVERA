# Build preview binaries by default. Only an explicit production-release run may
# publish an OTA update or submit to TestFlight / Play internal. Production OTA
# still uses the native fingerprint to avoid publishing incompatible JavaScript.
name: Build or release Lovera

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [preview-build, production-release]
        default: preview-build
        description: Build previews, or explicitly publish production updates / submit new binaries

jobs:
  preview_android:
    name: Build Android preview (no submission)
    if: ${{ inputs.action == 'preview-build' }}
    type: build
    params:
      platform: android
      profile: preview

  preview_ios:
    name: Build iOS preview (no submission)
    if: ${{ inputs.action == 'preview-build' }}
    type: build
    params:
      platform: ios
      profile: preview

  fingerprint:
    name: Fingerprint
    if: ${{ inputs.action == 'production-release' }}
    type: fingerprint

  # Has this exact native layer already been built? If so we reuse it and send an update instead.
  get_android_build:
    name: Check for an existing Android build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      profile: production

  get_ios_build:
    name: Check for an existing iOS build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: production

  # Native changed: build. `autoIncrement` plus `appVersionSource: remote` in eas.json means the
  # build number comes from EAS and climbs on its own — there is nowhere in this repository for it
  # to live, because `ios/` and `android/` are generated and gitignored.
  build_android:
    name: Build Android
    needs: [get_android_build]
    if: ${{ inputs.action == 'production-release' && !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: production

  build_ios:
    name: Build iOS
    needs: [get_ios_build]
    if: ${{ inputs.action == 'production-release' && !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production

  submit_android_build:
    name: Submit Android build
    needs: [build_android]
    if: ${{ inputs.action == 'production-release' }}
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}

  submit_ios_build:
    name: Submit iOS build
    needs: [build_ios]
    if: ${{ inputs.action == 'production-release' }}
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}

  # Native unchanged: the binaries already out there can run this. Ship it over the air.
  publish_android_update:
    name: Publish Android update
    needs: [get_android_build]
    if: ${{ inputs.action == 'production-release' && needs.get_android_build.outputs.build_id }}
    type: update
    params:
      branch: production
      platform: android

  publish_ios_update:
    name: Publish iOS update
    needs: [get_ios_build]
    if: ${{ inputs.action == 'production-release' && needs.get_ios_build.outputs.build_id }}
    type: update
    params:
      branch: production
      platform: ios
