name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: matchmaker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q -p no:warnings
        env:
          MM_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/matchmaker_test
          MM_ENV: test
      # Both front ends address the API with string literals, and nothing ties those
      # strings to the routes they mean to hit. A path that was renamed, pluralised or
      # never existed compiles, typechecks, bundles and ships, then 404s on a member's
      # phone. This job already has the API importable, so it is the cheapest place to
      # compare the two. It is how /safety/center and a /date-plans/{id}/confirm that
      # never existed were found.
      - name: Every client API call hits a route that exists
        run: |
          python -c "import json; from app.main import app; json.dump(app.openapi(), open('openapi.json','w'))"
          python ../../tools/check_api_contract.py openapi.json ../../apps/mobile ../../apps/web/src
        env:
          MM_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/matchmaker_test
          MM_ENV: test
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Typecheck and a bundle prove the app compiles. They proved nothing about whether a
      # screen survives the payload the API actually sends — which is how the Safety tab came
      # to crash on cases.map and dial tel:[object Object]. These render screens against
      # payloads copied from the API's own responses.
      - run: npm test -- --ci
      # A Metro export is the cheapest thing that proves the app still builds:
      # it resolves every route and native module without needing a device or a
      # signing certificate.
      - run: npx expo export --platform android --output-dir /tmp/mobile-export
        env:
          EXPO_NO_TELEMETRY: "1"
      # The stores read AndroidManifest.xml and Info.plist, not app.config.ts, and the
      # two can disagree: a plugin adds a purpose string for a permission we never use, a
      # blocked permission comes back in through manifest merging, an unconfigured splash
      # falls back to white. Prebuild is the only way to see what they will actually read,
      # and it needs no Android SDK or Xcode — just the native templates from npm.
      - run: npx expo prebuild --platform all --no-install --clean
        env:
          EXPO_NO_TELEMETRY: "1"
      - run: python3 scripts/check-native-config.py
      # Every router.push in this app casts its target, which silences the one check that
      # would catch a typo — so a tap that navigates nowhere compiles, bundles and ships.
      # The route list comes from expo-router's own getRoutes, not from guessing at the
      # filesystem, so (group) segments and [param] matching behave as they will at runtime.
      - run: node scripts/check-routes.js
      # A build for anything but a developer's laptop must name a reachable API origin.
      # Expo inlines it at bundle time, so getting this wrong ships a binary that installs,
      # launches, and then fails every request — which no test on the JS side can see.
      # Note this reads the environment, not eas.json: eas.json's `env` is applied by the
      # EAS builder, so these cases stand in for what it will pass.
      - name: The shipping-build guards hold
        run: |
          set -euo pipefail
          real_id=11111111-2222-3333-4444-555555555555
          refuse() {  # label, then env assignments the build would carry
            local label="$1"; shift
            if env EAS_BUILD_PROFILE=production "$@" \
                 npx expo config --type public --json >/dev/null 2>&1; then
              echo "::error::a production build was allowed with $label"
              exit 1
            fi
            echo "refused:  $label"
          }
          accept() {
            local label="$1"; shift
            env "$@" npx expo config --type public --json >/dev/null
            echo "accepted: $label"
          }
          refuse "no API origin"            EXPO_PUBLIC_API_ORIGIN=  EXPO_PUBLIC_EAS_PROJECT_ID="$real_id"
          refuse "the eas.json placeholder" EXPO_PUBLIC_API_ORIGIN=https://api.example.com EXPO_PUBLIC_EAS_PROJECT_ID="$real_id"
          refuse "a cleartext origin"       EXPO_PUBLIC_API_ORIGIN=http://api.aimatchmaker.app EXPO_PUBLIC_EAS_PROJECT_ID="$real_id"
          refuse "no EAS project id"        EXPO_PUBLIC_API_ORIGIN=https://api.aimatchmaker.app
          refuse "a placeholder project id" EXPO_PUBLIC_API_ORIGIN=https://api.aimatchmaker.app EXPO_PUBLIC_EAS_PROJECT_ID=REPLACE-ME-run-eas-init
          accept "a real origin and project id" EAS_BUILD_PROFILE=production \
                 EXPO_PUBLIC_API_ORIGIN=https://api.aimatchmaker.app EXPO_PUBLIC_EAS_PROJECT_ID="$real_id"
          accept "the development profile, unconfigured" EAS_BUILD_PROFILE=development
          accept "no profile at all, as \`expo start\` runs" EXPO_NO_TELEMETRY=1
        env:
          EXPO_NO_TELEMETRY: "1"
  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: matchmaker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -e "apps/api[dev]"
      - run: cd apps/web && npm ci && npx playwright install --with-deps chromium
      # Wait for the API to answer rather than guessing at a sleep: it creates the
      # schema on startup and so does the seeder, and starting the seed early used to
      # race it. The advisory lock in create_schema now makes that safe either way,
      # but a fixed sleep is still the wrong tool for "is it up yet".
      - run: |
          cd apps/api
          (uvicorn app.main:app --port 8000 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/healthz >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/healthz >/dev/null || { echo "API did not come up"; exit 1; }
          python -m app.seed
        env:
          MM_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/matchmaker
      - run: cd apps/web && npx playwright test
        env:
          E2E_PSQL_ARGS: -h localhost -p 5432 -U postgres -d matchmaker
          PGPASSWORD: postgres
      # Playwright already records a trace and a screenshot for every failure
      # (trace: retain-on-failure in playwright.config.ts), but the runner threw
      # them away, so an intermittent failure left nothing to diagnose but the
      # console tail. Keep them for a fortnight instead.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
  images:
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: matchmaker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t matchmaker-api apps/api
      - run: docker build --build-arg API_ORIGIN=http://127.0.0.1:8000 -t matchmaker-web apps/web
      - name: Smoke test the API image
        run: |
          docker run -d --name api --network host \
            -e MM_DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/matchmaker \
            -e MM_SECRET_KEY=ci-only-secret-0123456789abcdef matchmaker-api
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/healthz && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/healthz
          curl -sf -X POST http://127.0.0.1:8000/v1/auth/start -H 'Content-Type: application/json' -d '{"email":"smoke@example.test"}' | grep -q challenge_id
      - name: Smoke test the web image
        run: |
          docker run -d --name web --network host matchmaker-web
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3000/welcome && break; sleep 2; done
          curl -sf -o /dev/null -w "%{http_code}\n" http://127.0.0.1:3000/welcome | grep -q 200
          # The rewrite must proxy to the API container through the baked-in origin
          curl -sf http://127.0.0.1:3000/api/plans | grep -q '"plans"'
      - if: failure()
        run: docker logs api; docker logs web
