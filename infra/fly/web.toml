# Member web app.
#
#   fly deploy --config infra/fly/web.toml --app <your-web-app> \
#     --build-arg API_ORIGIN=https://<your-api-app>.fly.dev \
#     --build-arg NEXT_PUBLIC_WS_URL=wss://<your-api-app>.fly.dev/v1/realtime/ws
#
# Both are build args rather than runtime env because Next inlines the public
# one at build time; changing them means rebuilding, not restarting.
primary_region = "fra"

[build]
  dockerfile = "../../apps/web/Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "4s"
    grace_period = "20s"
    method = "GET"
    path = "/welcome"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
